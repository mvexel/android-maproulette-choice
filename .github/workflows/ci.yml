name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_writes:
        description: "Also build a stage APK that sends answers to stage (edits the real OpenStreetMap)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests, lint, debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK (ANDROID_HOME); AGP installs missing platforms.
      # assembleProdRelease (unsigned here) checks the release build the release workflow signs.
      # assembleDemoDebug: the in-process "Woodbine trees" demo (no backend), for field checks on an emulator;
      # its androidTest APK holds PinAccessTest, which the emulator smoke runs.
      - name: Assemble (dev, stage and demo debug, prod release), unit tests, lint
        run: ./gradlew assembleDevDebug assembleStageDebug assembleDemoDebug assembleDemoDebugAndroidTest assembleProdRelease testDevDebugUnitTest lintDevDebug -PmaprouletteGuests=true -PversionCode=${{ github.run_number }} --console=plain
      # PNGs of the report screens from the snapshot tests (ReportSnapshotTest), for design review.
      - name: Upload report screen snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-report-snapshots
          path: app/build/outputs/snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      # Manual runs only. Installing it and answering on stage still need Martijn's go-ahead.
      - name: Assemble stage APK with live writes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_writes }}
        run: |
          rm -rf app/build/outputs/apk
          ./gradlew assembleStageDebug -PmaprouletteAllowLiveWrites=true -PmaprouletteGuests=true -PversionCode=${{ github.run_number }} --console=plain
      - name: Upload stage live-writes APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_writes }}
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-stage-live-writes-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator smoke (demo build)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: street-tally-debug-apks
          path: apks
      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same checks Tess runs on the Mac: Nearest after answering, Nearest on a fresh launch,
      # no ANR or crash. Demo build only, so nothing leaves the emulator.
      - name: Run smoke check on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/ci/emulator-smoke.sh "$(find apks -name '*demo-debug.apk' | head -1)" smoke-out "$(find apks -name '*demo-debug-androidTest.apk' | head -1)"
      - name: Upload smoke screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-emulator-smoke
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14
