name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests, lint, debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK (ANDROID_HOME); AGP installs missing platforms.
      - name: Assemble (dev and stage), unit tests, lint
        run: ./gradlew assembleDevDebug assembleStageDebug testDevDebugUnitTest lintDevDebug --console=plain
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
