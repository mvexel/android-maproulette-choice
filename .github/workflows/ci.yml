name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_writes:
        description: "Also build a stage APK that sends answers to stage (edits the real OpenStreetMap)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests, lint, debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK (ANDROID_HOME); AGP installs missing platforms.
      # assembleProdRelease (unsigned here) checks the release build the release workflow signs.
      - name: Assemble (dev and stage debug, prod release), unit tests, lint
        run: ./gradlew assembleDevDebug assembleStageDebug assembleProdRelease testDevDebugUnitTest lintDevDebug -PmaprouletteGuests=true -PversionCode=${{ github.run_number }} --console=plain
      # PNGs of the report screens from the snapshot tests (ReportSnapshotTest), for design review.
      - name: Upload report screen snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-report-snapshots
          path: app/build/outputs/snapshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      # Manual runs only. Installing it and answering on stage still need Martijn's go-ahead.
      - name: Assemble stage APK with live writes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_writes }}
        run: |
          rm -rf app/build/outputs/apk
          ./gradlew assembleStageDebug -PmaprouletteAllowLiveWrites=true -PmaprouletteGuests=true -PversionCode=${{ github.run_number }} --console=plain
      - name: Upload stage live-writes APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_writes }}
        uses: actions/upload-artifact@v4
        with:
          name: street-tally-stage-live-writes-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
