name: Release

# A signed release APK on a GitHub Release, for the pilot's install page
# (release/woodbine-release-checklist.md A2). Runs when Martijn pushes a version tag (v0.2.0).
# Dormant until the release key is set up: secrets STREET_TALLY_KEYSTORE_BASE64,
#   STREET_TALLY_KEYSTORE_PASSWORD, STREET_TALLY_KEY_ALIAS, STREET_TALLY_KEY_PASSWORD.
# The prod OAuth client is maproulette-ios-choice (app/build.gradle.kts); the optional
# variable MAPROULETTE_PROD_OAUTH_CLIENT_ID overrides it.
# The release is created as a draft: publishing it makes
# https://github.com/mvexel/android-maproulette-choice/releases/latest/download/street-tally.apk
# serve this APK.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Check the tag and key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREET_TALLY_KEYSTORE_BASE64 }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret STREET_TALLY_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the prod release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.STREET_TALLY_KEYSTORE_BASE64 }}
          STREET_TALLY_KEYSTORE_PASSWORD: ${{ secrets.STREET_TALLY_KEYSTORE_PASSWORD }}
          STREET_TALLY_KEY_ALIAS: ${{ secrets.STREET_TALLY_KEY_ALIAS }}
          STREET_TALLY_KEY_PASSWORD: ${{ secrets.STREET_TALLY_KEY_PASSWORD }}
          CLIENT_ID: ${{ vars.MAPROULETTE_PROD_OAUTH_CLIENT_ID }}
        run: |
          export STREET_TALLY_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$STREET_TALLY_KEYSTORE"
          client=()
          [ -z "$CLIENT_ID" ] || client=(-PmaprouletteOAuthClientId="$CLIENT_ID")
          ./gradlew assembleProdRelease --console=plain \
            -PversionName="$VERSION" -PversionCode=${{ github.run_number }} \
            -PmaprouletteAllowLiveWrites=true -PmaprouletteGuests=true \
            "${client[@]}"
          rm -f "$STREET_TALLY_KEYSTORE"
      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/prod/release/app-prod-release.apk
          [ -f "$apk" ] || { echo "::error::No signed APK (unsigned builds are named *-unsigned.apk)"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" street-tally.apk
      - name: Write the release notes
        run: |
          changes=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^-----BEGIN/,$d' | sed '/^\s*$/d')
          [ -n "$changes" ] || changes="- Pilot build."
          python3 - "$changes" <<'PY'
          import os, sys
          text = open(".github/release/notes.md").read()
          for key, value in {
              "{version}": os.environ["VERSION"], "{tag}": os.environ["TAG"],
              "{sha}": os.environ["GITHUB_SHA"][:7], "{backend}": "prod", "{changes}": sys.argv[1],
          }.items():
              text = text.replace(key, value)
          open("notes.md", "w").write(text)
          PY
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" street-tally.apk --draft --verify-tag \
            --title "Street Tally $VERSION" --notes-file notes.md
